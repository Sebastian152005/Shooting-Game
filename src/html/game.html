<!DOCTYPE html>
<html lang="es">
<head>
    <base href="../../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR IN SPACE</title>
    <link rel="stylesheet" href="src/css/common.css">
    <link rel="stylesheet" href="src/css/game.css">
</head>
<body>
    <canvas width="900" height="540" id="game" tabindex="0" aria-label="Zona de juego. Flechas o A y D para moverse; Espacio para disparar; E para activar el pulso defensivo; P o Escape para pausar. Enter para reiniciar después de perder.">Tu navegador necesita soporte de Canvas para ejecutar el juego.</canvas>
    <dialog id="pauseMenu" class="pause-dialog" aria-labelledby="pauseTitle">
        <div class="pause-icon" aria-hidden="true"><span></span><span></span></div>
        <p class="pause-eyebrow">WAR IN SPACE</p>
        <h2 id="pauseTitle">Pausa</h2>
        <p class="pause-description">Vuelve a la misión cuando quieras.</p>
        <button id="resumeGame" class="pause-resume" type="button" autofocus>Continuar <span aria-hidden="true">→</span></button>
        <details id="audioSettings" class="audio-settings" aria-label="Ajustes de sonido"></details>
    </dialog>
    <nav id="touchControls" class="touch-controls" aria-label="Controles táctiles">
        <div class="touch-movement" role="group" aria-label="Movimiento">
            <button type="button" data-input-action="moveLeft" aria-label="Mover nave a la izquierda">&#x2190;</button>
            <button type="button" data-input-action="moveRight" aria-label="Mover nave a la derecha">&#x2192;</button>
        </div>
        <div class="touch-actions" role="group" aria-label="Acciones">
            <button type="button" data-input-action="pulse" aria-label="Activar pulso defensivo">PULSO</button>
            <button type="button" data-input-action="fire" aria-label="Disparar">FUEGO</button>
        </div>
        <button class="touch-pause" type="button" data-input-action="pause" aria-label="Pausar juego">&#x2016;</button>
    </nav>
    <script type="module" src="src/js/bootstrap/game-entry.js"></script>
</body>
</html>
