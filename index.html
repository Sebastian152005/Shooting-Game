<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR IN SPACE</title>
    <link rel="stylesheet" href="src/css/common.css">
    <link rel="stylesheet" href="src/css/menu.css">
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline aria-hidden="true" src="src/assets/video/menu.mp4"></video>
    <div class="overlay" aria-hidden="true"></div>

    <main class="menu">

        <div class="title-wrap">
            <h1 class="game-title" data-text="WAR IN SPACE">WAR IN SPACE</h1>
            <p class="tagline">La galaxia necesita un héroe</p>
        </div>

        <a href="src/html/game.html" class="btn-play" id="btnPlay">JUGAR</a>

        <div class="high-score-wrap">
            <span class="hs-label">Mejor puntaje</span>
            <span class="hs-value" id="highScore">0</span>
        </div>

        <div class="controls">
            <div class="control-item">
                <div class="keys"><kbd>←</kbd><kbd>→</kbd></div>
                <span>Moverse</span>
            </div>
            <div class="control-sep"></div>
            <div class="control-item">
                <div class="keys"><kbd>A</kbd><kbd>D</kbd></div>
                <span>Alternativo</span>
            </div>
            <div class="control-sep"></div>
            <div class="control-item">
                <div class="keys"><kbd>ESPACIO</kbd></div>
                <span>Disparar</span>
            </div>
            <div class="control-sep"></div>
            <div class="control-item">
                <div class="keys"><kbd>CLICK</kbd><kbd>P / ESC</kbd></div>
                <span>Pausar</span>
            </div>
        </div>

    </main>

    <details id="audioSettings" class="audio-settings" aria-label="Ajustes de sonido"></details>
    <script src="src/js/config.js"></script>
    <script src="src/js/infrastructure/storage.js"></script>
    <script src="src/js/application/settings.js"></script>
    <script src="src/js/presentation/ui/settings.js"></script>
    <script src="src/js/bootstrap/menu.js"></script>

</body>
</html>
